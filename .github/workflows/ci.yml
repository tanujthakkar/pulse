name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          # ubuntu-latest already has one SDK, usually /usr/local/lib/android/sdk.
          # AGP aborts when ANDROID_HOME and ANDROID_SDK_ROOT differ, so install
          # into that tree and export both names to it. Do not create a second SDK.
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          else
            echo "No preinstalled Android SDK. Refusing to create a second tree."
            exit 1
          fi
          case "$SDK" in
            /home/runner/android-sdk*)
              echo "Refusing SDK path $SDK"
              exit 1
              ;;
          esac
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"

      - name: Unit tests, lint, and guardrails
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          if [ "$ANDROID_HOME" != "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_HOME and ANDROID_SDK_ROOT must be the same path"
            exit 1
          fi
          ./gradlew check --stacktrace
