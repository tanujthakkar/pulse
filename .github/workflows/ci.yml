name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          # Hosted runners already set ANDROID_SDK_ROOT. AGP aborts when that
          # path and ANDROID_HOME disagree, so install into the existing SDK
          # and export both names to the same directory.
          SDK="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$SDK/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools/* "$SDK/cmdline-tools/latest/"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --install \
            "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"

      - name: Unit tests, lint, and guardrails
        run: |
          set -euo pipefail
          if [ "$ANDROID_HOME" != "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_HOME ($ANDROID_HOME) and ANDROID_SDK_ROOT ($ANDROID_SDK_ROOT) must match"
            exit 1
          fi
          ./gradlew check --stacktrace
